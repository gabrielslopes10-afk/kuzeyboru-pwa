<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>KUZEYBORU Monitoramento</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b3e">

<!-- iOS Safari: "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KUZEYBORU">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0d1b3e; overflow: hidden; }

  #app-frame {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    height: 100dvh;
    border: none;
    background: #0d1b3e;
  }

  #splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    background: #0d1b3e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    z-index: 20;
    transition: opacity .35s ease;
  }
  #splash img { width: 84px; height: 84px; border-radius: 20px; }
  #splash .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #d62839;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #splash.hidden { opacity: 0; pointer-events: none; }

  #offline-banner {
    position: fixed; left: 0; right: 0; top: 0;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: #d62839; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px; text-align: center;
    z-index: 30;
    display: none;
  }
  #offline-banner.show { display: block; }

  #ios-install-tip {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    background: rgba(20,20,30,.96); color: #fff;
    border-radius: 14px; padding: 14px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px; line-height: 1.4;
    display: none; z-index: 40;
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  #ios-install-tip.show { display: flex; align-items: center; gap: 10px; }
  #ios-install-tip button {
    margin-left: auto; background: transparent; border: none; color: #9aa4c7;
    font-size: 18px; padding: 4px 8px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="splash">
  <img src="icon-192.png" alt="KUZEYBORU">
  <div class="spinner"></div>
</div>

<div id="offline-banner">Sem conexão — os dados exigem internet para carregar.</div>

<iframe id="app-frame"
        src="https://script.google.com/macros/s/AKfycbzWTboZNze7BcZH4EqEr99szgBly3yjiAd-6_Qtj819VrWSBduANDTdk3U4OVPMTMqrBA/exec"
        title="KUZEYBORU Monitoramento"
        allow="clipboard-write"></iframe>

<div id="ios-install-tip">
  <span>Instale este app: toque em <strong>Compartilhar</strong> ⬆️ e depois em <strong>"Adicionar à Tela de Início"</strong>.</span>
  <button id="ios-tip-close" aria-label="Fechar">✕</button>
</div>

<script>
  // Hide splash once the iframe finishes loading (or after a timeout fallback).
  const frame = document.getElementById('app-frame');
  const splash = document.getElementById('splash');
  function hideSplash() { splash.classList.add('hidden'); }
  frame.addEventListener('load', hideSplash);
  setTimeout(hideSplash, 6000);

  // Offline / online banner.
  const banner = document.getElementById('offline-banner');
  function updateOnlineState() {
    banner.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', updateOnlineState);
  window.addEventListener('offline', updateOnlineState);
  updateOnlineState();

  // iOS Safari has no install prompt API — show a manual one-time tip.
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const tip = document.getElementById('ios-install-tip');
  if (isIos && !isStandalone && !localStorage.getItem('kzb_ios_tip_dismissed')) {
    setTimeout(() => tip.classList.add('show'), 1200);
  }
  document.getElementById('ios-tip-close').addEventListener('click', () => {
    tip.classList.remove('show');
    localStorage.setItem('kzb_ios_tip_dismissed', '1');
  });

  // Register the service worker (caches this shell only; the app data always
  // comes live from the Apps Script backend inside the iframe).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>

</body>
</html>
